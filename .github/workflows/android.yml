# Builds and signs the Android app on GitHub, then publishes it as a GitHub Release.
# Runs when iphone/version.json changes (a new version) or the Android project changes, or by hand
# (Actions → Build the Android app → Run workflow).
#
# One-time setup: repository Settings → Secrets and variables → Actions → New repository secret:
#   KEYSTORE_BASE64  the signing key (keys/tarot.keystore) as base64 text
#   KS_PASS          the keystore password (the value after KS_PASS= in keys/signing.env)
#
# The newest APK is always at https://github.com/PacoGeist/paco-tarot/releases/latest/download/PacoTarot.apk
# (iphone/version.json "apk" points the in-app updater there).
name: Build the Android app

on:
  push:
    branches: [main]
    paths: ['iphone/version.json', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KS_PASS secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install Android build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Bundle the card data and version number
        run: |
          node tools/build_data.js
          pip install --quiet pillow
          python3 tools/build_web.py

      - name: Build and sign PacoTarot.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/tarot.keystore"
          ANDROID_SDK="$ANDROID_HOME" KEYS="$RUNNER_TEMP/keys" bash android/build.sh
          rm -rf "$RUNNER_TEMP/keys" android/build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('iphone/version.json'))['version'])")
          python3 -c "import json;v=json.load(open('iphone/version.json'));print('\n'.join('- '+n for n in v.get('notes',[])))" > notes.md
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" android/releases/PacoTarot.apk --clobber
          else
            gh release create "v$V" android/releases/PacoTarot.apk --title "Paco Morningstar's Tarot $V" --notes-file notes.md --latest
          fi
