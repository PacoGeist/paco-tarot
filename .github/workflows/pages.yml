# Publishes the iPhone (web) app in the iphone/ folder to GitHub Pages whenever it changes.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish the iPhone app

on:
  push:
    branches: [main]
    paths: ['iphone/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the card data, version number and offline file list
        run: |
          node tools/build_data.js
          pip install --quiet pillow
          python3 tools/build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iphone
      - id: deploy
        uses: actions/deploy-pages@v4
